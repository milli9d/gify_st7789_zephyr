CONFIG_SHELL=y
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y
CONFIG_SHELL_PROMPT_UART="¯\\_(ツ)_/¯ =:"

CONFIG_PRINTK=y
CONFIG_STDOUT_CONSOLE=y
CONFIG_LOG=y

CONFIG_ESPTOOLPY_FLASHSIZE_8MB=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_SOC_FLASH_ESP32=y

CONFIG_FILE_SYSTEM=y
CONFIG_FILE_SYSTEM_LITTLEFS=y
CONFIG_FILE_SYSTEM_SHELL=y

CONFIG_DISK_ACCESS=y
CONFIG_FILE_SYSTEM=y
CONFIG_FILE_SYSTEM_SHELL=y
CONFIG_FAT_FILESYSTEM_ELM=y
CONFIG_FS_FATFS_MOUNT_MKFS=y
CONFIG_FILE_SYSTEM_MKFS=y
CONFIG_TEST_RANDOM_GENERATOR=y
CONFIG_FILE_SYSTEM_EXT2=y

CONFIG_FS_LOG_LEVEL_DBG=n

CONFIG_BT=y
CONFIG_BT_DEVICE_NAME="Gify"
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_GATT_CLIENT=y
CONFIG_BT_SHELL=y
CONFIG_BT_RX_STACK_SIZE=4096

CONFIG_BT_OTS=y
CONFIG_BT_OTS_SECONDARY_SVC=y
CONFIG_BT_OTS_DIR_LIST_OBJ=y
CONFIG_BT_OTS_OBJ_NAME_WRITE_SUPPORT=y
CONFIG_BT_OTS_OACP_WRITE_SUPPORT=y
CONFIG_BT_OTS_OACP_PATCH_SUPPORT=y
CONFIG_BT_OTS_OACP_CREATE_SUPPORT=y
CONFIG_BT_OTS_OACP_DELETE_SUPPORT=y
CONFIG_BT_OTS_OACP_CHECKSUM_SUPPORT=y
CONFIG_BT_AUTO_PHY_PERIPHERAL_2M=y
CONFIG_BT_GATT_AUTO_UPDATE_MTU=y
CONFIG_BT_MAX_CONN=1

# Give the main/init thread more headroom; FATFS mkfs/mount and logging were
# running on this stack before main(), and a small default stack can corrupt
# scheduler state and crash later during disconnect.
CONFIG_ASSERT=y
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_STACK_SENTINEL=y
CONFIG_INIT_STACKS=y
CONFIG_THREAD_STACK_INFO=y

# sysworkq blows up after disconnect; give it more headroom
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096

# HCI ACL buffers size
# BT_L2CAP_RX_MTU = CONFIG_BT_BUF_ACL_RX_SIZE - BT_L2CAP_HDR_SIZE
CONFIG_BT_BUF_ACL_RX_SIZE=1024

# L2CAP SDU/PDU TX MTU
CONFIG_BT_L2CAP_TX_MTU=1024